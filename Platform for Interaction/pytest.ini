[pytest]
# Тести тренажера Q-навчання. Запуск з папки "Platform for Interaction":
#   & "..\Pytorch_test\.venv\Scripts\python.exe" -m pytest            (швидкі тести)
#   & "..\Pytorch_test\.venv\Scripts\python.exe" -m pytest --runslow  (усе, перед комітом)
testpaths = tests
# Рівень тесту визначається префіксом файлу (див. tests/conftest.py)
python_files = test_*.py smoke_*.py regression_*.py
# Папка тренажера — у шляху імпорту (для пакета qlearn з етапу 2)
pythonpath = .
addopts = -ra
markers =
    unit: юніт-тести (файли test_*.py)
    smoke: smoke-тести «програма живе» (файли smoke_*.py)
    regression: регресійні тести — поведінка не змінилась (файли regression_*.py)
    slow: повільні тести, запускаються лише з --runslow
    gui: потребують tkinter і дисплея
    torch: потребують PyTorch
